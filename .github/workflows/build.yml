name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      # GitHub'ın Ubuntu imajında Android SDK (platform 35, build-tools 34/35) hazır kurulu;
      # ayrı bir SDK kurulum adımına gerek yok.
      - run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: whazzapp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
